[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-events"
version = "0.1.6"
description = "General-purpose async event bus (file-backed, JSON Lines) — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "events", "event-bus", "telemetry", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Canonical local-state directory helper (project-scope override +
    # auto runtime/ seed creation). Per scitex-python skill
    # 01_arch_06_local-state-directories.md.
    "scitex-config>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # CI install step uses pytest-timeout (see .github/workflows/test.yml);
    # pin it here so local dev mirrors CI behaviour.
    "pytest-timeout",
    "ruff",
    # cli-audit pulls click + pyyaml so `scitex-dev ecosystem audit-all`
    # works locally and tests/develop/test_audit.py runs (not skips).
    "scitex-dev[cli-audit]>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-events[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-events"
Repository = "https://github.com/ywatanabe1989/scitex-events"
Documentation = "https://scitex-events.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_events = ["_skills/**/*.md", "_sphinx_html/**"]

[project.entry-points."scitex_dev.skills"]
scitex-events = "scitex_events"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.coverage.run]
parallel = true
source = ["scitex_events"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "apps", "config", "docs", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]

dependencies = [
    "scitex-dev>=0.17.8",
]
